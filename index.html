<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuadernillo de práctica — ingreso a 3er grado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E2A44">
<meta name="description" content="Ejercicios y evaluaciones de práctica para la escuela primaria: Inglés, Matemática y Lengua, con revisión para el adulto.">
<style>
:root{
  --paper:#F6F8FB; --sheet:#FFFFFF; --ink:#1E2A44; --muted:#5C6A84; --dim:#8E9AB0;
  --line:#DCE3EC; --rule:#DCE8F5; --margin:#E35D8C; --field:#F7F9FC;
  --band:#1E2A44; --bandtx:#FFFFFF;
  --c-ing:#2F6FDE; --c-mat:#E8922B; --c-len:#23955F;
  --okbg:#E5F4EC; --okbd:#2E9A63; --oktx:#17663F;
  --bdbg:#FCE9EC; --bdbd:#D24B5A; --bdtx:#9C2533;
  --note:#FFF3B0; --notebd:#EBD46A; --notetx:#4A3F10; --notehd:#7A5D00;
  --wnbg:#FFF8E1; --wnbd:#E6C45C; --wntx:#5E4A0E; --wnst:#8A6500;
  --focus:#2F6FDE;
}
[data-t="dark"]{
  --paper:#16201C; --sheet:#1D2925; --ink:#E7EEE9; --muted:#A3B6AB; --dim:#728579;
  --line:#2D3B35; --rule:#23312B; --margin:#B4577A; --field:#18231F;
  --band:#0F1714; --bandtx:#E7EEE9;
  --c-ing:#6E9BEF; --c-mat:#E9A453; --c-len:#58BE87;
  --okbg:#183427; --okbd:#3FA672; --oktx:#9BE3BC;
  --bdbg:#3A1F25; --bdbd:#C9566A; --bdtx:#F3AEB9;
  --note:#3A3620; --notebd:#5E5630; --notetx:#EFE5B6; --notehd:#F2D36E;
  --wnbg:#332D18; --wnbd:#6E5F2C; --wntx:#EADBA6; --wnst:#F2C75C;
  --focus:#8FB6FF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Andika',ui-rounded,system-ui,-apple-system,sans-serif;background:var(--paper);
  color:var(--ink);font-size:17px;line-height:1.5;padding-bottom:72px}
button,input,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ----- cabecera: banda de color plano ----- */
header{background:var(--band);color:var(--bandtx);padding:18px 0 20px;border-bottom:6px solid var(--accent,var(--band))}
.hrow{display:flex;align-items:flex-start;gap:12px}
header h1{margin:0;font-size:25px;font-weight:700;line-height:1.2}
header p{margin:5px 0 0;font-size:15px;opacity:.9}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:38px;height:38px;border-radius:10px;flex:0 0 auto}
.ic{background:rgba(255,255,255,.16);border:0;color:inherit;font-size:18px;border-radius:12px;
  width:42px;height:42px;cursor:pointer;flex:0 0 auto}
.back{background:rgba(255,255,255,.16);border:0;color:inherit;font-weight:700;font-size:15px;
  border-radius:10px;padding:7px 13px;cursor:pointer;margin-bottom:12px}

/* ----- tarjetas de grado y de materia: separadores de cuaderno ----- */
.subj{display:flex;align-items:stretch;width:100%;text-align:left;border:1px solid var(--line);
  background:var(--sheet);color:var(--ink);border-radius:14px;padding:0;margin:12px 0;cursor:pointer;overflow:hidden}
.subj .tab{flex:0 0 14px;background:var(--tab,var(--ink))}
.subj .body{flex:1;padding:15px 16px 14px;min-width:0}
.subj .top{display:flex;align-items:center;gap:12px}
.subj .gnum{font-size:38px;font-weight:700;line-height:1;color:var(--ink);min-width:52px}
.subj .emo{font-size:26px}
.subj h3{margin:0;font-size:19px;font-weight:700}
.subj .tag{font-size:13px;font-weight:700;color:var(--muted);margin-left:auto;white-space:nowrap}
.subj p{margin:6px 0 0;font-size:15px;color:var(--muted)}
.subj.lined .body{background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule) 27px 28px)}
.subj.grid .body{background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:16px 16px}
.subj.off{cursor:default}
.subj.off .tab{background:var(--line)}
.subj.off .gnum,.subj.off h3{color:var(--dim)}
.bar{height:6px;border-radius:99px;background:var(--line);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tab);border-radius:99px;transition:width .3s}
.subj .pg{font-size:13px;color:var(--muted);margin-top:6px}

.tips{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  margin:16px 0 4px;font-size:15px;color:var(--muted)}
.tips b{color:var(--ink)}
.tips ul{margin:8px 0 0;padding-left:20px}
.tips li{margin:5px 0}
.steps{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:16px 0}
.steps h3{margin:0 0 8px;font-size:17px;font-weight:700}
.steps ol{margin:0;padding-left:22px;font-size:15px;color:var(--muted)}
.steps li{margin:7px 0}
.steps b{color:var(--ink)}

/* ----- pestañas de módulos ----- */
nav{position:sticky;top:0;z-index:20;background:var(--paper);padding:10px 0 9px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--sheet);color:var(--muted);border-radius:10px;
  padding:8px 13px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--sheet);box-shadow:inset 0 -4px 0 var(--tab,var(--ink))}
.chip .dot{margin-right:5px}
.chip .mini{font-size:12px;opacity:.75;margin-left:6px;font-weight:400}

.unit-head{display:flex;align-items:center;gap:12px;margin:20px 0 4px}
.unit-head .em{font-size:32px}
.unit-head h2{margin:0;font-size:22px;font-weight:700;line-height:1.25}
.unit-head p{margin:2px 0 0;font-size:15px;color:var(--muted)}
.score{display:inline-block;font-size:15px;font-weight:700;color:var(--muted);margin:12px 0 0}

/* ----- "Cómo se usa": post-it ----- */
.rules{background:var(--note);border:1px solid var(--notebd);border-radius:6px 6px 14px 6px;padding:14px 16px;
  margin:14px 0;color:var(--notetx);box-shadow:0 1px 0 var(--notebd)}
.rules summary{font-weight:700;font-size:17px;cursor:pointer;color:var(--notehd);list-style:none;display:flex;align-items:center;gap:6px}
.rules summary::-webkit-details-marker{display:none}
.rules summary::after{content:"\25BE";margin-left:auto;transition:transform .2s}
.rules[open] summary::after{transform:rotate(180deg)}
.rsec{margin-top:14px}
.rsec h4{margin:0 0 6px;font-size:16px;font-weight:700}
.rrow{display:flex;gap:10px;align-items:center;border-bottom:1px dashed var(--notebd);padding:7px 2px;font-size:16px}
.rl{flex:1;min-width:0}
.ra{font-weight:700;text-align:right}
.exline{font-size:16px;margin:6px 0 0;line-height:1.55}
.warn{background:rgba(255,255,255,.45);border-left:4px solid var(--notehd);border-radius:6px;padding:9px 12px;margin:10px 0 0;font-size:15.5px;line-height:1.5}
[data-t="dark"] .warn{background:rgba(0,0,0,.18)}
.yes{color:var(--okbd);font-weight:700}
.no{color:var(--bdbd);font-weight:700}

/* ----- ejercicio: hoja de cuaderno con margen ----- */
.card{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px 16px 58px;margin:14px 0}
.card::before{content:"";position:absolute;left:44px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.55}
.num{position:absolute;left:0;top:15px;width:44px;text-align:center;font-size:17px;font-weight:700;color:var(--margin)}
.num small{display:block;font-size:11px;font-weight:400;color:var(--dim)}
.q{font-size:18px;font-weight:700;margin:0 0 4px;line-height:1.4}
.q .en{color:var(--c-ing)}
.hint{font-size:15px;color:var(--muted);margin:2px 0 10px}
.big-emoji{font-size:40px;line-height:1;margin:0 0 6px}

.opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.opt{text-align:left;font-size:17px;font-weight:700;color:var(--ink);background:var(--field);border:2px solid var(--line);
  border-radius:12px;padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:48px}
.opt:active{transform:scale(.99)}
.opt .mark{margin-left:auto}
.opt.ok{background:var(--okbg);border-color:var(--okbd);color:var(--oktx)}
.opt.bad{background:var(--bdbg);border-color:var(--bdbd);color:var(--bdtx)}
.opt.off{opacity:.38;pointer-events:none}
.lock{pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.sh{animation:shake .3s}

.match{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mi{font-size:16px;font-weight:700;padding:10px 8px;border-radius:12px;border:2px solid var(--line);background:var(--field);
  cursor:pointer;color:var(--ink);text-align:center;min-height:46px}
.mi.en{color:var(--c-ing)}
.mi.sel{border-color:var(--focus);box-shadow:inset 0 0 0 2px var(--focus)}
.mi.ok{background:var(--okbg);border-color:var(--okbd);color:var(--oktx);pointer-events:none}
.mi.bad{background:var(--bdbg);border-color:var(--bdbd);color:var(--bdtx);pointer-events:none}

.frow{display:flex;gap:10px;align-items:center;margin:8px 0}
.flab{font-size:16px;font-weight:700;color:var(--muted);flex:0 1 auto;min-width:3em;max-width:45%}
.fin{flex:1;min-width:70px;font-size:18px;font-weight:700;padding:10px 12px;border:2px solid var(--line);border-radius:10px;
  background:var(--field);color:var(--c-ing);outline:none;width:100%}
.fin:focus{border-color:var(--focus)}
.fin.ok{background:var(--okbg);border-color:var(--okbd);color:var(--oktx)}
.fin.bad{background:var(--bdbg);border-color:var(--bdbd);color:var(--bdtx)}
.go{font-size:16px;font-weight:700;color:var(--sheet);background:var(--ink);border:0;border-radius:10px;padding:12px 20px;cursor:pointer;margin-top:10px;min-height:46px}
.go:disabled{opacity:.4;cursor:default}
.go.ghost{background:transparent;border:2px solid var(--line);color:var(--muted)}

.slots{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px;min-height:44px}
.slot{min-width:56px;text-align:center;font-size:17px;font-weight:700;padding:9px 11px;border-radius:10px;border:2px dashed var(--line);color:var(--dim);background:var(--field)}
.slot.full{border-style:solid;color:var(--ink)}
.slot.ok{border-color:var(--okbd);background:var(--okbg);color:var(--oktx)}
.slot.bad{border-color:var(--bdbd);background:var(--bdbg);color:var(--bdtx)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pz{font-size:17px;font-weight:700;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;min-height:46px}
.pz.used{opacity:.25;pointer-events:none}

.open textarea{width:100%;font-size:17px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;color:var(--ink);outline:none;
  min-height:112px;resize:vertical;line-height:28px;background:var(--field) repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule) 27px 28px);background-attachment:local}
.open textarea:focus{border-color:var(--focus)}
.nocorr{font-size:14px;color:var(--dim);margin-top:8px}
.paper{font-size:14px;font-weight:700;color:var(--wnst);background:var(--wnbg);border-radius:8px;padding:5px 10px;display:inline-block;margin-bottom:8px}

/* ----- revisión y reinicio ----- */
.rev{display:block;width:100%;font-size:17px;font-weight:700;color:var(--sheet);background:var(--ink);border:0;border-radius:12px;padding:15px;margin:22px 0 4px;cursor:pointer}
.rev:disabled{background:transparent;border:2px dashed var(--line);color:var(--dim);cursor:default}
.reset{display:block;width:100%;font-size:16px;font-weight:700;background:transparent;border:2px solid var(--line);color:var(--muted);border-radius:12px;padding:13px;margin:10px 0 6px;cursor:pointer}
.rbox{background:var(--sheet);border:1px solid var(--line);border-top:5px solid var(--ink);border-radius:12px;padding:16px;margin:14px 0}
.rbox h3{margin:0 0 4px;font-size:19px;font-weight:700}
.rbox .sm{font-size:15px;color:var(--muted);margin:0 0 10px}
.ritem{border-top:1px solid var(--line);padding:12px 0}
.ritem:first-of-type{border-top:0}
.rq{font-size:16px;font-weight:700;margin-bottom:5px}
.rline{font-size:15.5px;margin:3px 0}
.rline span{font-weight:700}
.rwrong{color:var(--bdtx)}
.rright{color:var(--oktx)}
.rexp{font-size:15px;color:var(--muted);margin-top:6px;white-space:pre-line;line-height:1.5}

.modal-bg{position:fixed;inset:0;background:rgba(10,15,25,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--sheet);color:var(--ink);border-radius:16px;padding:20px;max-width:380px;width:100%;border:1px solid var(--line)}
.modal h3{margin:0 0 6px;font-size:19px;font-weight:700}
.modal p{margin:0 0 12px;font-size:15px;color:var(--muted)}
.mq{font-size:26px;font-weight:700;margin:4px 0 12px}
.merr{font-size:14px;font-weight:700;color:var(--bdtx);margin-top:6px;display:none}
.merr.on{display:block}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.booklinks{display:flex;flex-direction:column;gap:8px;margin:12px 0 0}
.booklink{display:block;background:var(--sheet);border:1px solid var(--line);border-left:6px solid var(--tab,var(--ink));border-radius:10px;
  padding:11px 14px;color:var(--ink);text-decoration:none;font-size:16px}
.booklink:hover{border-color:var(--tab,var(--ink))}
footer{text-align:center;font-size:14px;color:var(--dim);padding:22px 16px 6px}
</style>
</head>
<body>

<header id="hd"><div class="wrap" id="hdin"></div></header>
<nav id="nav" style="display:none"><div class="chips" id="chips"></div></nav>
<div class="wrap" id="content"></div>
<footer>Las respuestas se guardan solo en este dispositivo.</footer>

<script src="config.js"></script>
<script>
/* ---------- tema ---------- */
try{ if(localStorage.getItem("cuad_tema")==="dark") document.documentElement.setAttribute("data-t","dark"); }catch(e){}
function isDark(){ return document.documentElement.getAttribute("data-t")==="dark"; }
function toggleTheme(){
  const d=isDark();
  document.documentElement.setAttribute("data-t", d?"light":"dark");
  try{ localStorage.setItem("cuad_tema", d?"light":"dark"); }catch(e){}
  paintHeader();
}

/* ---------- almacenamiento ---------- */
const KEY="ee_v6";
let ST={};
try{
  ST=JSON.parse(localStorage.getItem(KEY)||"null");
  if(!ST){
    /* migración: la versión anterior tenía un solo grado (3º) y guardaba sin prefijo */
    ST={};
    const old=JSON.parse(localStorage.getItem("cuadernillo_v5")||"{}");
    Object.keys(old).forEach(k=>{ ST["3-"+k]=old[k]; });
    localStorage.setItem(KEY,JSON.stringify(ST));
  }
}catch(e){ ST={}; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){} }
let G=null, DATA=null;
function kk(s,u,i){ return G+"-"+s+"."+u+"."+i; }
function get(s,u,i){ return ST[kk(s,u,i)]||null; }
function put(s,u,i,v){ ST[kk(s,u,i)]=v; save(); }
function wipeUnit(s,u){ const pf=G+"-"+s+"."+u+"."; Object.keys(ST).forEach(x=>{ if(x.indexOf(pf)===0) delete ST[x]; }); save(); }

/* ---------- grados ---------- */
const CATALOG=[
 {g:"2",label:"Ingreso a 2º grado",c1:"#E0A21B",c2:"#E0A21B"},
 {g:"3",label:"Ingreso a 3º grado",c1:"#E2643E",c2:"#E2643E"},
 {g:"4",label:"Ingreso a 4º grado",c1:"#C9468A",c2:"#C9468A"},
 {g:"5",label:"Ingreso a 5º grado",c1:"#7A5FD6",c2:"#7A5FD6"},
 {g:"6",label:"Ingreso a 6º grado",c1:"#2386B8",c2:"#2386B8"},
 {g:"7",label:"Ingreso a 7º grado",c1:"#2E8A57",c2:"#2E8A57"}
];
window.GRADES=window.GRADES||{};
function gradeInfo(g){ return CATALOG.find(x=>x.g===g); }
function loadGrade(g,cb){
  if(GRADES[g]){ cb(true); return; }
  const sc=document.createElement("script");
  sc.src="grados/g"+g+".js?v="+(window.EE_VER||"1");
  sc.onload=()=>cb(!!GRADES[g]); sc.onerror=()=>cb(false);
  document.head.appendChild(sc);
}
function selectGrade(g){
  loadGrade(g,ok=>{
    if(!ok){
      view="grades"; draw();
      document.getElementById("content").insertAdjacentHTML("afterbegin",'<div class="card"><div class="q">No se pudieron cargar los ejercicios de ese grado.</div><div class="hint">Revisá la conexión y probá de nuevo.</div></div>');
      return;
    }
    G=g; DATA=GRADES[g].subjects;
    try{ localStorage.setItem("ee_grado",g); }catch(e){}
    view="home"; si=0; ui=0; showRev=false; draw();
  });
}
function reviewed(s,u){ return !!ST[kk(s,u,"__rev")]; }

/* ---------- utilidades ---------- */
const GRADED={choice:1,match:1,spell:1,fill:1,order:1};
function clean(s){
  return String(s).toLowerCase().trim().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[.,;:!?¡¿"'´`()]/g,"").replace(/\s+/g," ").trim();
}
function hit(given,exp){
  exp=String(exp);
  if(exp.slice(0,3)==="re:"){ try{ return new RegExp(exp.slice(3),"i").test(String(given).trim()); }catch(e){ return false; } }
  const g=clean(given), e=clean(exp);
  return g===e || g.replace(/\s/g,"")===e.replace(/\s/g,"");
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function txt(h){ const d=document.createElement("div"); d.innerHTML=h; return d.textContent||""; }

function isAnswered(ex,sv){
  if(!sv) return false;
  if(GRADED[ex.t]) return !!sv.answered;
  if(ex.t==="open") return ex.paper ? !!sv.done : !!(sv.v&&sv.v.trim().length);
  return false;
}
/* total = TODAS las tarjetas del módulo; graded = solo las que se corrigen solas */
function unitStats(sub,unit){
  let total=0,done=0,graded=0,ok=0,open=0;
  unit.ex.forEach((e,i)=>{
    total++;
    const sv=get(sub.id,unit.id,i);
    if(isAnswered(e,sv)) done++;
    if(GRADED[e.t]){ graded++; if(sv&&sv.answered&&sv.ok) ok++; }
    else open++;
  });
  return {total,done,graded,ok,open,complete:total>0&&done===total};
}
function subjStats(sub){
  let total=0,done=0;
  sub.units.forEach(u=>{ const s=unitStats(sub,u); total+=s.total; done+=s.done; });
  return {total,done};
}

/* ---------- control para el adulto (sin diálogos del navegador) ---------- */
function adultGate(title,okText,onPass){
  const a=12+Math.floor(Math.random()*18), b=6+Math.floor(Math.random()*4);
  const bg=document.createElement("div"); bg.className="modal-bg";
  bg.innerHTML='<div class="modal"><h3>👤 '+title+'</h3>'+
    '<p>Para seguir, resolvé esta cuenta. Es para que solo pueda hacerlo un adulto.</p>'+
    '<div class="mq">¿Cuánto es '+a+' × '+b+'?</div>'+
    '<input class="fin" id="gin" inputmode="numeric" autocomplete="off" placeholder="…">'+
    '<div class="merr" id="gerr">No es correcto.</div>'+
    '<div class="mbtns"><button class="go ghost" id="gno">Cancelar</button>'+
    '<button class="go" id="gok">'+okText+'</button></div></div>';
  document.body.appendChild(bg);
  const inp=bg.querySelector("#gin");
  setTimeout(()=>inp.focus(),50);
  function close(){ bg.remove(); }
  function test(){
    if(parseInt(inp.value,10)===a*b){ close(); onPass(); }
    else{ bg.querySelector("#gerr").classList.add("on"); inp.classList.add("bad","sh"); setTimeout(()=>inp.classList.remove("sh"),340); }
  }
  bg.querySelector("#gno").onclick=close;
  bg.querySelector("#gok").onclick=test;
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") test(); });
  bg.addEventListener("click",e=>{ if(e.target===bg) close(); });
}

/* ---------- navegación ---------- */
let view="grades", si=0, ui=0, showRev=false;

function paintHeader(){
  const hd=document.getElementById("hd"), inn=document.getElementById("hdin");
  const th='<button class="ic" id="th" aria-label="Cambiar tema">'+(isDark()?"☀️":"🌙")+'</button>';
  if(view==="grades"){
    hd.style.setProperty("--accent","");
    inn.innerHTML='<div class="hrow"><div style="flex:1"><div class="brand"><img src="icon.svg" alt=""><h1>Ejercicios y evaluaciones</h1></div>'+
      '<p>Práctica para la escuela primaria</p></div>'+th+'</div>';
  }else if(view==="home"){
    const gi=gradeInfo(G);
    hd.style.setProperty("--accent",gi.c1);
    inn.innerHTML='<button class="back" id="bk">← Grados</button>'+
      '<div class="hrow"><div style="flex:1"><h1>'+gi.label+'</h1><p>Elegí una materia</p></div>'+th+'</div>';
    document.getElementById("bk").onclick=()=>{ view="grades"; draw(); };
  }else{
    const s=DATA[si];
    hd.style.setProperty("--accent",subjColor(s));
    inn.innerHTML='<button class="back" id="bk">← Materias</button>'+
      '<div class="hrow"><div style="flex:1"><h1>'+s.emo+' '+s.name+'</h1><p>'+gradeInfo(G).label+'</p></div>'+th+'</div>';
    document.getElementById("bk").onclick=()=>{ view="home"; ui=0; showRev=false; draw(); };
  }
  document.getElementById("th").onclick=toggleTheme;
}

function draw(){
  document.body.style.setProperty("--tab", (view==="subject"&&DATA)?subjColor(DATA[si]):"");
  paintHeader();
  const box=document.getElementById("content"), nv=document.getElementById("nav");
  box.innerHTML="";
  if(view==="grades"){ nv.style.display="none"; drawGrades(box); }
  else if(view==="home"){ nv.style.display="none"; drawHome(box); }
  else{ nv.style.display="block"; drawChips(); drawUnit(box); }
  window.scrollTo({top:0,behavior:"smooth"});
}

function subjColor(s){ return s.id==="mate"?"var(--c-mat)":(s.id==="lengua"?"var(--c-len)":"var(--c-ing)"); }
function drawGrades(box){
  const t=document.createElement("p"); t.className="score"; t.style.margin="18px 0 0";
  t.textContent="¿A qué grado va a entrar?"; box.appendChild(t);
  CATALOG.forEach(gi=>{
    const ready=(window.EE_READY||[]).indexOf(gi.g)>=0;
    const b=document.createElement("button");
    b.className="subj"+(ready?"":" off");
    b.style.setProperty("--tab",gi.c1);
    b.innerHTML='<span class="tab"></span><span class="body"><span class="top">'+
      '<span class="gnum">'+gi.g+'º</span><span><h3>'+gi.label+'</h3>'+
      '<p style="margin:2px 0 0">'+(ready?"Inglés, Matemática y Lengua":"Próximamente")+'</p></span></span></span>';
    if(ready) b.onclick=()=>selectGrade(gi.g); else b.disabled=true;
    box.appendChild(b);
  });
  const p=document.createElement("div"); p.className="tips";
  const lb=document.createElement("a"); lb.className="booklink"; lb.href="libro.html"; lb.style.margin="16px 0 0";
  lb.innerHTML='📚 <b>Biblioteca:</b> fichas de los libros de lectura'; box.appendChild(lb);
  p.innerHTML='<b>¿Qué grado elijo?</b> El grado al que el chico o la chica va a entrar. Si termina 2º, elegí «Ingreso a 3º grado».';
  box.appendChild(p);
}

function drawHome(box){
  DATA.forEach((s,i)=>{
    const st=subjStats(s);
    const pct=st.total?Math.round(st.done/st.total*100):0;
    const b=document.createElement("button");
    b.className="subj "+(s.id==="mate"?"grid":"lined");
    b.style.setProperty("--tab",subjColor(s));
    b.innerHTML='<span class="tab"></span><span class="body"><span class="top"><span class="emo">'+s.emo+'</span><h3>'+s.name+'</h3>'+
      '<span class="tag">'+s.tag+'</span></span><p>'+s.desc+'</p>'+
      '<span class="bar" style="display:block"><i style="width:'+pct+'%"></i></span>'+
      '<span class="pg" style="display:block">'+st.done+' de '+st.total+' respondidos</span></span>';
    b.onclick=()=>{ si=i; ui=0; showRev=false; view="subject"; draw(); };
    box.appendChild(b);
  });
  const t=document.createElement("div"); t.className="steps";
  t.innerHTML='<h3>📌 Cómo está organizado</h3><ol>'+
    '<li><b>Inglés:</b> incluye el programa del grado anterior y el del grado al que se ingresa. Seguí los módulos en orden: los primeros son la base de los últimos.</li>'+
    '<li><b>Matemática y Lengua:</b> una parte por día, sin apurar.</li>'+
    '<li>Cada módulo se responde <b>una sola vez</b>. Al terminarlo entero se habilita la revisión.</li></ol>';
  box.appendChild(t);
  const p=document.createElement("div"); p.className="tips";
  p.innerHTML='<b>Cómo funciona:</b> pensado para que ella responda sola y el adulto revise después.'+
    '<ul><li><b>Un solo intento</b> por ejercicio. Si se equivoca queda en rojo y no se puede volver a contestar.</li>'+
    '<li><b>Nunca se muestra la respuesta correcta</b> mientras resuelve.</li>'+
    '<li>La <b>revisión</b> y el <b>reinicio</b> piden una cuenta de adulto, para que no pueda ver respuestas ni volver a empezar por su cuenta.</li>'+
    '<li>Todo queda guardado en este dispositivo.</li></ul>';
  box.appendChild(p);
}

function drawChips(){
  const s=DATA[si], c=document.getElementById("chips");
  c.innerHTML="";
  s.units.forEach((u,i)=>{
    const st=unitStats(s,u);
    const b=document.createElement("button");
    b.className="chip"+(i===ui?" on":"");
    b.innerHTML='<span class="dot">'+u.dot+'</span>'+u.name+
      '<span class="mini">'+st.done+'/'+st.total+'</span>';
    b.onclick=()=>{ ui=i; showRev=false; draw(); };
    c.appendChild(b);
  });
}

function revLabel(st){ return st.complete?"👤 Revisión del adulto":"👤 Revisión — faltan "+(st.total-st.done); }
function refreshScore(){
  const s=DATA[si], u=s.units[ui], st=unitStats(s,u);
  const a=document.getElementById("sc1");
  if(a) a.textContent=st.done+" de "+st.total+" respondidos";
  const rv=document.getElementById("revbtn");
  if(rv){ rv.disabled=!st.complete; rv.textContent=revLabel(st); }
  drawChips();
}

function drawUnit(box){
  const s=DATA[si], u=s.units[ui];
  const head=document.createElement("div"); head.className="unit-head";
  head.innerHTML='<div class="em">'+u.dot+'</div><div><h2>'+u.title+'</h2><p>'+u.sub+'</p></div>';
  box.appendChild(head);

  if(u.books&&u.books.length){
    const bl=document.createElement("div"); bl.className="booklinks";
    bl.innerHTML=u.books.map(b=>'<a class="booklink" href="libro.html#'+b.id+'">📚 Ficha del libro: <b>'+b.title+'</b></a>').join("");
    box.appendChild(bl);
  }
  if(u.rules){
    const r=document.createElement("details"); r.className="rules"; r.open=true;
    r.innerHTML='<summary>Cómo se usa</summary>'+u.rules;
    box.appendChild(r);
  }
  const st=unitStats(s,u);
  if(!st.total) return;

  const row=document.createElement("div");
  row.innerHTML='<span class="score" id="sc1">'+st.done+' de '+st.total+' respondidos</span>';
  box.appendChild(row);

  if(reviewed(s.id,u.id)){
    const lk=document.createElement("div"); lk.className="tips";
    lk.innerHTML='<b>🔒 Módulo cerrado.</b> Ya se abrió la revisión, así que las respuestas quedaron fijas. Para volver a hacerlo, usá el reinicio de abajo.';
    box.appendChild(lk);
  }

  u.ex.forEach((ex,i)=>box.appendChild(card(ex,i,s,u)));

  const rv=document.createElement("button");
  rv.className="rev"; rv.id="revbtn"; rv.disabled=!st.complete; rv.textContent=revLabel(st);
  rv.onclick=()=>{
    if(showRev){ showRev=false; draw(); return; }
    const open=()=>{ ST[kk(s.id,u.id,"__rev")]=true; save(); showRev=true; draw();
      setTimeout(()=>{ const r=document.getElementById("rbox"); if(r) r.scrollIntoView({behavior:"smooth"}); },80); };
    if(reviewed(s.id,u.id)) open(); else adultGate("Revisión del adulto","Ver revisión",open);
  };
  box.appendChild(rv);
  if(showRev && st.complete) box.appendChild(reviewPanel(s,u));

  const r=document.createElement("button");
  r.className="reset"; r.textContent="🔄 Reiniciar este módulo desde cero";
  r.onclick=()=>adultGate("Reiniciar «"+u.title+"»","Borrar y reiniciar",()=>{ wipeUnit(s.id,u.id); showRev=false; draw(); });
  box.appendChild(r);
}

/* ---------- revisión ---------- */
function reviewPanel(s,u){
  const st=unitStats(s,u);
  const w=document.createElement("div"); w.className="rbox"; w.id="rbox";
  let sub='<b>'+st.ok+' de '+st.graded+'</b> correctas en los ejercicios que se corrigen solos.';
  if(st.open) sub+=' Además hay <b>'+st.open+'</b> consigna'+(st.open>1?'s':'')+' abierta'+(st.open>1?'s':'')+' para que revises vos.';
  w.innerHTML='<h3>👤 Revisión del adulto</h3><p class="sm">'+sub+'</p>';

  u.ex.forEach((ex,i)=>{
    const sv=get(s.id,u.id,i)||{};
    const d=document.createElement("div"); d.className="ritem";
    let h='<div class="rq">'+(i+1)+'. '+txt(ex.q).slice(0,120)+'</div>';
    if(ex.t==="choice"){
      h+='<div class="rline '+(sv.ok?"rright":"rwrong")+'">'+(sv.ok?"✅":"❌")+' Respondió: <span>'+(sv.p!=null?txt(ex.o[sv.p]):"—")+'</span></div>';
      if(!sv.ok) h+='<div class="rline rright">✔ Correcta: <span>'+txt(ex.o[ex.a])+'</span></div>';
    }else if(ex.t==="fill"||ex.t==="spell"){
      const ans=ex.t==="spell"?[ex.a]:ex.a, labs=ex.t==="spell"?[""]:(ex.labels||ans.map(()=>""));
      ans.forEach((a,j)=>{
        const mine=(sv.v&&sv.v[j])||"", good=hit(mine,a);
        h+='<div class="rline '+(good?"rright":"rwrong")+'">'+(good?"✅":"❌")+' '+(labs[j]?txt(labs[j])+': ':'')+
           '<span>'+(mine||"(vacío)")+'</span>'+
           (good?'':' → correcta: <span>'+(String(a).slice(0,3)==="re:"?"(hay varias válidas)":a)+'</span>')+'</div>';
      });
    }else if(ex.t==="match"){
      const bad=(sv.m||[]).filter(p=>p[0]!==p[1]);
      h+='<div class="rline '+(sv.ok?"rright":"rwrong")+'">'+(sv.ok?"✅ Todos los pares bien":"❌ "+bad.length+" par"+(bad.length>1?"es":"")+" mal")+'</div>';
      bad.forEach(p=>{ h+='<div class="rline rwrong">· Unió <span>'+ex.pairs[p[0]][0]+'</span> con <span>'+ex.pairs[p[1]][1]+'</span> → era <span>'+ex.pairs[p[0]][1]+'</span></div>'; });
    }else if(ex.t==="order"){
      h+='<div class="rline '+(sv.ok?"rright":"rwrong")+'">'+(sv.ok?"✅":"❌")+' Ordenó: <span>'+((sv.v||[]).join(" · ")||"—")+'</span></div>';
      if(!sv.ok) h+='<div class="rline rright">✔ Orden correcto: <span>'+ex.a.join(" · ")+'</span></div>';
    }else if(ex.t==="open"){
      if(ex.paper) h+='<div class="rline">✍️ '+(sv.done?"Lo hizo en el cuaderno: revisalo ahí.":"(no lo marcó como hecho)")+'</div>';
      else h+='<div class="rline">✍️ Escribió: <span>'+((sv.v||"").trim()||"(sin respuesta)")+'</span></div>';
    }
    if(ex.why && ex.t!=="open") h+='<div class="rexp">💡 '+ex.why+'</div>';
    if(ex.model) h+='<div class="rexp">💡 Qué mirar: '+ex.model+'</div>';
    d.innerHTML=h; w.appendChild(d);
  });
  return w;
}

/* ---------- tarjetas ---------- */
function card(ex,i,s,u){
  const c=document.createElement("div"); c.className="card";
  let h='<div class="num" aria-label="Ejercicio '+(i+1)+' de '+u.ex.length+'">'+(i+1)+'<small>de '+u.ex.length+'</small></div>';
  if(ex.paper) h+='<div class="paper">✍️ Para hacer en el cuaderno</div>';
  if(ex.e) h+='<div class="big-emoji">'+ex.e+'</div>';
  h+='<div class="q">'+ex.q+'</div>';
  if(ex.h) h+='<div class="hint">👉 '+ex.h+'</div>';
  c.innerHTML=h;
  const ctx={s:s.id,u:u.id,i:i,saved:get(s.id,u.id,i),ex:ex,locked:reviewed(s.id,u.id)};
  const B={choice:bChoice,match:bMatch,order:bOrder,open:bOpen};
  if(ex.t==="spell") c.appendChild(bFill(ctx,true));
  else if(ex.t==="fill") c.appendChild(bFill(ctx,false));
  else if(B[ex.t]) c.appendChild(B[ex.t](ctx));
  return c;
}

function bChoice(ctx){
  const ex=ctx.ex, sv=ctx.saved, answered=!!(sv&&sv.answered);
  const opts=document.createElement("div"); opts.className="opts";
  ex.o.forEach((t,j)=>{
    const b=document.createElement("button"); b.className="opt";
    b.innerHTML='<span>'+t+'</span><span class="mark"></span>';
    if(answered){
      if(sv.p===j){ b.classList.add(sv.ok?"ok":"bad"); b.querySelector(".mark").textContent=sv.ok?"✅":"❌"; }
      else b.classList.add("off");
    }
    b.onclick=()=>{
      if(opts.classList.contains("lock")) return;
      const ok=(j===ex.a);
      opts.classList.add("lock");
      b.classList.add(ok?"ok":"bad"); b.querySelector(".mark").textContent=ok?"✅":"❌";
      if(!ok) b.classList.add("sh");
      [...opts.children].forEach(c=>{ if(c!==b) c.classList.add("off"); });
      put(ctx.s,ctx.u,ctx.i,{answered:true,ok:ok,p:j}); refreshScore();
    };
    opts.appendChild(b);
  });
  if(answered||ctx.locked) opts.classList.add("lock");
  return opts;
}

function bFill(ctx,isSpell){
  const ex=ctx.ex, sv=ctx.saved, answered=!!(sv&&sv.answered);
  const ans=isSpell?[ex.a]:ex.a, labs=isSpell?[""]:(ex.labels||ans.map(()=>""));
  const vals=(sv&&sv.v)||ans.map(()=>"");
  const w=document.createElement("div"), ins=[];
  ans.forEach((a,j)=>{
    const row=document.createElement("div"); row.className="frow";
    if(labs[j]) row.innerHTML='<span class="flab">'+labs[j]+'</span>';
    const inp=document.createElement("input");
    inp.type="text"; inp.className="fin"; inp.autocomplete="off"; inp.spellcheck=false;
    inp.autocapitalize="none"; inp.placeholder="…"; inp.value=vals[j]||"";
    if(answered){ inp.disabled=true; inp.classList.add(hit(vals[j]||"",a)?"ok":"bad"); }
    if(ctx.locked) inp.disabled=true;
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
    row.appendChild(inp); ins.push(inp); w.appendChild(row);
  });
  const btn=document.createElement("button"); btn.className="go";
  btn.textContent=answered?"Respondido":"Responder";
  btn.disabled=answered||ctx.locked;
  function go(){
    if(btn.disabled) return;
    const v=ins.map(x=>x.value);
    if(v.every(x=>!x.trim())){ ins[0].classList.add("sh"); setTimeout(()=>ins[0].classList.remove("sh"),340); return; }
    let all=true;
    ins.forEach((inp,j)=>{
      const good=hit(inp.value,ans[j]); if(!good) all=false;
      inp.disabled=true; inp.classList.add(good?"ok":"bad"); if(!good) inp.classList.add("sh");
    });
    btn.disabled=true; btn.textContent="Respondido";
    put(ctx.s,ctx.u,ctx.i,{answered:true,ok:all,v:v}); refreshScore();
  }
  btn.onclick=go; w.appendChild(btn);
  return w;
}

function bMatch(ctx){
  const ex=ctx.ex, sv=ctx.saved;
  const w=document.createElement("div"); w.className="match";
  const L=document.createElement("div"); L.className="mcol";
  const R=document.createElement("div"); R.className="mcol";
  const ord=(sv&&sv.ord)||{l:shuffle(ex.pairs.map((p,i)=>i)),r:shuffle(ex.pairs.map((p,i)=>i))};
  const made=(sv&&sv.m)?sv.m.slice():[];
  const usedL={}, usedR={};
  made.forEach(p=>{ usedL[p[0]]=1; usedR[p[1]]=1; });
  let sel=null;
  const lB={}, rB={};
  ord.l.forEach(idx=>{
    const b=document.createElement("button"); b.className="mi en"; b.textContent=ex.pairs[idx][0]; lB[idx]=b;
    b.onclick=()=>{ if(ctx.locked||usedL[idx]) return; if(sel) sel.el.classList.remove("sel"); sel={el:b,i:idx}; b.classList.add("sel"); };
    L.appendChild(b);
  });
  ord.r.forEach(idx=>{
    const b=document.createElement("button"); b.className="mi"; b.textContent=ex.pairs[idx][1]; rB[idx]=b;
    b.onclick=()=>{
      if(ctx.locked||!sel||usedR[idx]) return;
      const li=sel.i, ok=(li===idx);
      sel.el.classList.remove("sel"); sel.el.classList.add(ok?"ok":"bad"); b.classList.add(ok?"ok":"bad");
      if(!ok){ sel.el.classList.add("sh"); b.classList.add("sh"); }
      usedL[li]=1; usedR[idx]=1; sel=null; made.push([li,idx]);
      const done=made.length===ex.pairs.length;
      put(ctx.s,ctx.u,ctx.i,{answered:done,ok:done&&made.every(p=>p[0]===p[1]),m:made,ord:ord});
      refreshScore();
    };
    R.appendChild(b);
  });
  made.forEach(p=>{ const ok=p[0]===p[1]; lB[p[0]].classList.add(ok?"ok":"bad"); rB[p[1]].classList.add(ok?"ok":"bad"); });
  w.appendChild(L); w.appendChild(R);
  return w;
}

function bOrder(ctx){
  const ex=ctx.ex, sv=ctx.saved, answered=!!(sv&&sv.answered);
  const w=document.createElement("div");
  const slots=document.createElement("div"); slots.className="slots";
  const pool=document.createElement("div"); pool.className="pool";
  const picked=(sv&&sv.v)?sv.v.slice():[];
  const ord=(sv&&sv.ord)||shuffle(ex.items.map((v,i)=>i));
  const usedIx=(sv&&sv.u)?sv.u.slice():[];
  const sl=ex.a.map((v,j)=>{
    const d=document.createElement("div"); d.className="slot";
    if(picked[j]!=null){ d.textContent=picked[j]; d.classList.add("full"); if(answered) d.classList.add(hit(picked[j],ex.a[j])?"ok":"bad"); }
    else d.textContent=(j+1)+"º";
    slots.appendChild(d); return d;
  });
  ord.forEach(ix=>{
    const v=ex.items[ix];
    const b=document.createElement("button"); b.className="pz"; b.textContent=v;
    if(usedIx.indexOf(ix)>=0) b.classList.add("used");
    b.onclick=()=>{
      if(ctx.locked||answered||usedIx.indexOf(ix)>=0) return;
      const pos=picked.length; if(pos>=ex.a.length) return;
      picked.push(v); usedIx.push(ix); b.classList.add("used");
      sl[pos].textContent=v; sl[pos].classList.add("full");
      const done=picked.length===ex.a.length; let allOk=false;
      if(done){ allOk=ex.a.every((a,j)=>hit(picked[j],a)); sl.forEach((d,j)=>d.classList.add(hit(picked[j],ex.a[j])?"ok":"bad")); }
      put(ctx.s,ctx.u,ctx.i,{answered:done,ok:allOk,v:picked,u:usedIx,ord:ord}); refreshScore();
    };
    pool.appendChild(b);
  });
  w.appendChild(slots); w.appendChild(pool);
  return w;
}

function bOpen(ctx){
  const ex=ctx.ex, sv=ctx.saved||{};
  const w=document.createElement("div"); w.className="open";
  if(ex.paper){
    const b=document.createElement("button");
    b.className="go"+(sv.done?"":" ghost");
    b.textContent=sv.done?"✔ Hecho en el cuaderno":"Marcar como hecho en el cuaderno";
    b.disabled=ctx.locked;
    b.onclick=()=>{
      if(ctx.locked) return;
      const d=!(get(ctx.s,ctx.u,ctx.i)||{}).done;
      put(ctx.s,ctx.u,ctx.i,{done:d});
      b.className="go"+(d?"":" ghost"); b.textContent=d?"✔ Hecho en el cuaderno":"Marcar como hecho en el cuaderno";
      refreshScore();
    };
    w.appendChild(b);
  }else{
    const ta=document.createElement("textarea");
    ta.placeholder="Escribí acá…"; ta.value=sv.v||""; ta.disabled=ctx.locked;
    let t=null;
    ta.addEventListener("input",()=>{ clearTimeout(t); t=setTimeout(()=>{ put(ctx.s,ctx.u,ctx.i,{v:ta.value}); refreshScore(); },350); });
    w.appendChild(ta);
  }
  const n=document.createElement("div"); n.className="nocorr";
  n.textContent="Esta consigna no se corrige sola: la revisa el adulto al final.";
  w.appendChild(n);
  return w;
}

/* ---------- arranque ---------- */
(function(){
  let g=null;
  try{ g=localStorage.getItem("ee_grado"); if(!g && localStorage.getItem("cuadernillo_v5")) g="3"; }catch(e){}
  if(g && (window.EE_READY||[]).indexOf(g)>=0) selectGrade(g);
  else draw();
})();
</script>
